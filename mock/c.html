<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<title>إرث · ضوء</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--card:#fff;--tx:#0F172A;--mut:#64748B;--line:#E7EAF0;--acc:#1D5BFF;--accs:#E8EEFF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{max-width:560px;margin:0 auto;color:var(--tx);font:15px/1.6 Almarai,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;background:rgba(245,246,248,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logo{font-weight:800;font-size:21px;color:var(--acc)}
h1{margin:8px 18px 0;font-size:32px;font-weight:800;line-height:1.3}
.sub{margin:2px 18px 0;color:var(--mut);font-size:14px}
.search{display:flex;align-items:center;gap:10px;height:50px;margin:16px 16px 0;padding:0 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04);color:var(--mut)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--tx)}
.search input::placeholder{color:#94A3B8}
.sec{margin:26px 18px 10px;font-size:17px;font-weight:800}
.favs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.favs::-webkit-scrollbar{display:none}
.fav{flex:0 0 74%;scroll-snap-align:start;display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.fav .ic{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accs);color:var(--acc)}
.fav .ic svg{width:22px;height:22px}
.fav b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;font-weight:700;line-height:1.45}
.fav small{display:block;margin-top:2px;color:var(--mut);font-size:12px}
.list{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.row{display:flex;align-items:center;gap:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.row:active{background:#F8FAFC}
.ph{position:relative;flex:none;width:58px;height:58px;border-radius:17px;overflow:hidden;display:grid;place-items:center;background:var(--accs);color:var(--acc);font-weight:800;font-size:22px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.tx{flex:1;min-width:0}
.nm{font-size:16px;font-weight:700;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pills span{padding:2px 9px;border-radius:999px;background:#F1F4F8;color:#475569;font-size:12px}
.chev{flex:none;width:20px;height:20px;color:#94A3B8}
.empty{padding:28px;text-align:center;color:var(--mut)}
.nav{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;color:var(--mut);font-size:12px}
.nav .ic{display:grid;place-items:center;width:58px;height:32px;border-radius:16px}
.nav a.on{color:var(--tx);font-weight:700}
.nav a.on .ic{background:var(--accs);color:var(--acc)}
.nav svg{width:22px;height:22px}
#toast{position:fixed;z-index:9;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;background:var(--tx);color:#fff;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top"><span class="logo">إرث</span></header>
<h1>المشايخ</h1>
<p class="sub" id="sub"></p>
<label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ابحث عن شيخ" autocomplete="off"></label>
<div class="sec">مفضلتي</div>
<div class="favs" id="favs"></div>
<div class="sec">كل المشايخ</div>
<div class="list" id="list"></div>
<nav class="nav" id="nav"></nav>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
M.start({
  fav:f=>`<a class="fav" href="#"><span class="ic">${M.svg('fav')}</span><span><b>${M.esc(f.title)}</b><small>${[M.esc(f.sheikh),M.cnt(f.lessons,'l'),M.cnt(f.hours,'h')].filter(Boolean).join(' · ')}</small></span></a>`,
  row:s=>`<a class="row" href="#"><div class="ph">${M.ini(s.name)}${M.img(s)}</div><div class="tx"><div class="nm">${M.esc(s.name)}</div><div class="pills">${[M.cnt(s.series,'s'),M.cnt(s.lessons,'l'),M.cnt(s.hours,'h')].filter(Boolean).map(t=>`<span>${t}</span>`).join('')}</div></div>${M.svg('chev','chev')}</a>`});
</script>
</body>
</html>
